name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The pinned typst binary is ~40 MB; only re-download when blog.toml
      # (which holds the version) changes.
      - uses: actions/cache@v4
        with:
          path: .tools
          key: typst-${{ hashFiles('blog.toml') }}

      # The HTML pages are font-independent (equations are MathML, not glyphs),
      # but the PDFs are not: without a CJK font, typst falls back to a Latin
      # face and Chinese comes out as tofu. Libertinus Serif ships inside typst.
      - name: Install CJK font for PDF export
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install
        run: pnpm install --frozen-lockfile

      # `pnpm build` runs scripts/compile.py first: it compiles every snapshot in
      # sources/ (the project repositories are not needed) and then builds Astro.
      - name: Compile notes and build site
        run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
