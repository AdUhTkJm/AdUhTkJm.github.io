# ============================================================================
# blog.toml — the curated allowlist of published notes.
#
# Nothing is published unless it is listed here. To publish a document, add a
# [[note]] block. The source file stays in its project repo; this repository
# only keeps a snapshot (sources/) and the compiled output (src/generated/).
#
# Run ./compile.sh after editing this file.
# ============================================================================

[site]
# GitHub Pages *user* site (repo AdUhTkJm.github.io) → served at the domain root.
# Keep base = "/" here AND in astro-paper.config.ts. A *project* site (repo
# named e.g. `blogs`, URL /<user>.github.io/blogs/) would instead need
# base = "/blogs" — Astro does not put `base` into the build output paths, so
# with a mismatched base every asset and link 404s.
url = "https://AdUhTkJm.github.io"
base = "/"
lang = "zh-CN"
title = "AdUhTkJm"
description = "AdUhTkJm 的个人博客。"
author = "AdUhTkJm"

[typst]
# Pinned on purpose. HTML export is behind `--features html` and is documented
# as unstable; upgrading typst can change the generated markup, so upgrades are
# deliberate acts that go through a diff review.
version = "0.15.1"

# ---------------------------------------------------------------------------
# Projects. Used to group notes on the home page and to label each page.
# ---------------------------------------------------------------------------

[[project]]
id = "game"
title = "游戏"
description = "什么游戏都有"
order = 10000

[[project]]
id = "compiler"
title = "编译器"
description = "LLVM 和 MLIR"
order = 20000

[[project]]
id = "llm"
title = "大语言模型"
description = "尝试魔改 LLM"
order = 30000

[[project]]
id = "novels"
title = "小说"
description = "各种小说，主要是同人。"
order = 40000

[[project]]
id = "misc"
title = "杂项"
description = "杂乱的小东西，没有单独的主题。"
order = 50000

# ---------------------------------------------------------------------------
# Notes. Only these get published.
#
#   source   path to the .typ file, or to a directory of them (absolute, or
#            relative to $HOME)
#   entry    only for a directory source: the root .typ to compile
#   exclude  only for a directory source: globs never copied into sources/
#   shim     only for a directory source: build-time fixes for the HTML
#            exporter; "diagram" wraps cetz/fletcher drawings in html.frame
#   slug     URL: /posts/<slug>/  (nested slugs give nicer grouping)
#   project  must match a [[project]] id above
#   title    shown as <h1> and in listings (the Typst title block is ignored)
#   summary  one line, shown in listings and <meta name="description">
#   tags     free-form
#   date     YYYY-MM-DD, used for sorting and "updated" display
#   order    listing position; lower first. It is the primary sort key of every
#            listing (home, /posts, tags, archives, RSS); the date only breaks
#            ties. So to get newest-first, give the newest note the smallest
#            order.
# ---------------------------------------------------------------------------


