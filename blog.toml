# ============================================================================
# blog.toml — the curated allowlist of published notes.
#
# Nothing is published unless it is listed here. To publish a document, add a
# [[note]] block. The source file stays in its project repo; this repository
# only keeps a snapshot (sources/) and the compiled output (src/generated/).
#
# Run ./compile.sh after editing this file.
# ============================================================================

[site]
# GitHub Pages *project* site → https://AdUhTkJm.github.io/blogs/
# For a *user* site (a repo named AdUhTkJm.github.io), set url = "https://AdUhTkJm.github.io" and base = "/".
url = "https://AdUhTkJm.github.io"
base = "/blogs"
lang = "zh-CN"
title = "AdUhTkJm"
description = "AdUhTkJm 的个人博客。"
author = "AdUhTkJm"

[typst]
# Pinned on purpose. HTML export is behind `--features html` and is documented
# as unstable; upgrading typst can change the generated markup, so upgrades are
# deliberate acts that go through a diff review.
version = "0.15.1"

# ---------------------------------------------------------------------------
# Projects. Used to group notes on the home page and to label each page.
# ---------------------------------------------------------------------------

[[project]]
id = "seedsearch"
title = "种子搜索"
description = "《杀戮尖塔 2》的种子搜索"
order = 1

[[project]]
id = "aw"
title = "应用工作台"
description = "Minecraft 的高速合成规划器"
order = 2

[[project]]
id = "llm"
title = "大语言模型"
description = "尝试魔改 LLM"
order = 3

[[project]]
id = "vm"
title = "JVM"
description = "JVM 的个人实现"
order = 4

[[project]]
id = "novels"
title = "小说"
description = "各种小说，主要是同人。"
order = 5

# ---------------------------------------------------------------------------
# Notes. Only these get published.
#
#   source   path to the .typ file (absolute, or relative to $HOME)
#   slug     URL: /posts/<slug>/  (nested slugs give nicer grouping)
#   project  must match a [[project]] id above
#   title    shown as <h1> and in listings (the Typst title block is ignored)
#   summary  one line, shown in listings and <meta name="description">
#   tags     free-form
#   date     YYYY-MM-DD, used for sorting and "updated" display
#   order    within the project; lower first
# ---------------------------------------------------------------------------

[[note]]
source = "~/projects/seedsearch/docs/optimizations.typ"
slug = "seedsearch/map-path-pruning"
project = "seedsearch"
title = "地图生成优化"
summary = "我加速了 100 倍的地图生成"
tags = ["种子搜索", "优化", "地图生成"]
date = "2026-10-17"
order = 1

[[note]]
source = "~/projects/aw/docs/algorithm.typ"
slug = "aw/planner-algorithm"
project = "aw"
title = "Minecraft 合成规划算法"
summary = "并没有看上去那么简单。"
tags = ["算法", "CP-SAT", "图论", "优化"]
date = "2026-10-10"
order = 1

[[note]]
source = "~/blogs/src/content/docs/llm-compression.typ"
slug = "llm/llm-compression"
project = "llm"
title = "Qwen 3.8 27B 三值量化的无损压缩"
summary = "只能减少 3.5%，但毕竟无损。"
tags = ["LLM", "优化"]
